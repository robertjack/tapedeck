name: evals

on:
  push:
  pull_request:

jobs:
  evals:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Seam tools (yt-dlp, ffmpeg, whisper, etc.) are faked by the evals'
      # fixtures/mocks under system/evals — no brew installs needed here.
      - name: Run durable evals
        run: uv run --with pytest pytest system/evals -q
