name: evals

on:
  push:
  pull_request:

jobs:
  evals:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Seam tools (yt-dlp, whisper, etc.) are faked by the evals' fixtures
      # under system/evals. ffmpeg is the one real-PATH dependency: doctor and
      # setup check for it genuinely, and the macOS runners don't ship it.
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Run durable evals
        run: uv run --with pytest pytest system/evals -q
