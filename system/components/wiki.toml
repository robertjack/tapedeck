[component]
name = "wiki"
purpose = "Maintain wiki/ as an AI-authored, git-versioned companion library at $TAPEDECK_HOME/wiki/: `file <id>` scaffolds it on first use, runs the configured maintainer against the archive page, then admits its changes only if the whole wiki still satisfies the acceptance gate (brief untouched, filed-state marker present, wikilinks resolve, deep links verify against the library, catalog and log current) — free-form inside, deterministic at the edges (SPEC-wiki-001)."
pace = "fast"
language = "python"

[owns]
paths = ["src/wiki/"]
data = ["wiki/**"]

[boundary]
contracts = ["system/contracts/wiki-layout.md", "system/contracts/library-layout.md", "system/contracts/ask-citations.md"]
consumes = ["ingest", "ask"]

[evals]
path = "system/evals/wiki/"
command = "just eval wiki"

[budget]
# Raised 16000 -> 32000 for the sweep round: SPEC-wiki-003/004/005 and their three
# eval suites put the assembly at ~29401. The component deliberately stays whole —
# sync, lint and rebuild are the same vocabulary as file, and splitting them would
# scatter it (LESSON-0003's concern, one layer up).
# Raised 32000 -> 42000 for the tend round: SPEC-wiki-006, the lock clause,
# LESSON-0004 and two eval suites measured ~38608.
# Raised 42000 -> 48000 for the streaming round: SPEC-wiki-007 and its eval
# suite land on an assembly already at ~38674 of 42000.
# Raised 48000 -> 56000 for the bookkeeping round: SPEC-wiki-008, the two
# wiki-layout amendments and test_bookkeeping.py land on an assembly already at
# ~41569 of 48000, which leaves too little for a generator to breathe in.
# Raised 56000 -> 64000 for the map round: SPEC-wiki-009 and test_map.py land on
# an assembly already at ~50616 of 56000.
# Raised 64000 -> 72000 for the correction round: SPEC-wiki-008's second amendment,
# SPEC-wiki-011 and two eval suites land the assembly at ~57808 of 64000. The
# component now carries eleven clauses; if the next round needs another raise, the
# question to ask first is whether the vocabulary still wants to be one component.
# Raised 72000 -> 78000 for the wait round: SPEC-wiki-012, the SPEC-wiki-007
# amendment and test_wait.py. The standing question was asked: --wait is a lock
# behavior, the lock is repo.py's vocabulary, and a lock component of its own
# would be a seam through the one invariant (one operation at a time) that must
# never have two owners. The vocabulary stays whole.
# Raised for the local-files round: the SPEC-wiki-002 citation amendment and
# test_local_video.py — the filed marker follows the video own address.
context_tokens = 82000
# Above the usual 8000/6000 default: the component carries its own git lifecycle
# (scaffold, per-run commit, hard reset/clean on gate failure) plus a six-check
# whole-wiki acceptance gate, on top of driving the maintainer subprocess itself.
# Raised 10000 -> 16000: file's generation landed at ~7161 and the sweep round
# adds three verbs (sync, the eight-check lint report with --json, rebuild).
# Raised 16000 -> 20000: tend (two modes) plus the operation lock.
# Raised 20000 -> 23000: SPEC-wiki-008 adds the reconciliation step — catalog
# lines from page headings, a chronology entry from the run's product, and the
# result event's cost figures — to an implementation already at ~17464.
# Raised 23000 -> 26000: SPEC-wiki-009 adds the map — a line per page, the
# relevance ranking behind the shortlist, and its assembly into three tasks — to
# an implementation already at ~19236.
# Raised 26000 -> 28000: code-span-aware wikilink parsing and printing a rejected
# run's product, on an implementation already at ~21443.
# Raised 28000 -> 30000: `file --wait` — a blocking acquire beside the
# refuse-fast one, its announce line, and the flag on file's parser.
src_tokens = 31000
