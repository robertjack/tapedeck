[component]
name = "ask"
purpose = "Question -> librarian agent run in the library home (default; answer accepted only after mechanical citation verification) or, with --fast, the strict pipeline: top-k retrieval via index -> answerer -> tapedeck-assembled citations. Probabilistic inside, deterministic at the edges (SPEC-ask-001, SPEC-ask-002)."
pace = "fast"
language = "python"

[owns]
paths = ["src/ask/"]
data = []

[boundary]
contracts = ["system/contracts/ask-citations.md"]
consumes = ["index"]

[evals]
path = "system/evals/ask/"
command = "just eval ask"

[budget]
# Raised 8000 -> 12000: SPEC-ask-005 (the published verify verb) put the assembled
# context at ~9983 tokens, over the old cap before any regen could start.
context_tokens = 12000
# Raised 6000 -> 8000: the last generation landed at 5997/6000 and its own notes said
# the budget must rise before any new clause arrives rather than prose be squeezed out
# of the implementation. SPEC-ask-004 and the citation-parsing clauses were that clause.
# Raised 8000 -> 10000 for the same reason: SPEC-ask-005 adds a verb (arg parsing,
# stdin path, the two flags) even though its verification core is shared.
src_tokens = 10000
