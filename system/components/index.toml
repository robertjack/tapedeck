[component]
name = "index"
purpose = "Own tapedeck.db: SQLite FTS5 over archive-page sections, fully regenerable from archive/*.md (reindex), with ranked timestamped search and deep links (SPEC-index-001, SPEC-index-002)."
pace = "medium"
language = "python"

[owns]
paths = ["src/index/"]
data = ["tapedeck.db"]

[boundary]
contracts = ["system/contracts/library-layout.md"]
consumes = []

[evals]
path = "system/evals/index/"
command = "just eval index"

[budget]
# Raised 8000 -> 11000 for the anchor round: SPEC-index-005 and
# test_anchor_stripping.py, read against SPEC-archive-002's pinned shape.
context_tokens = 11000
# Raised 6000 -> 7000: the exact leading-anchor strip in the chunker.
src_tokens = 7000
