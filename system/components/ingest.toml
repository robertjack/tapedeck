[component]
name = "ingest"
purpose = "Turn a YouTube URL into library/<id>/: extract the canonical video id, invoke the configured fetcher (default yt-dlp) for the full video, and write schema-valid meta.json. Sole writer of video files and metadata (SPEC-ingest-001)."
pace = "medium"
language = "python"

[owns]
paths = ["src/ingest/"]
data = ["library/*/video.*", "library/*/meta.json"]

[boundary]
contracts = ["system/contracts/library-layout.md", "system/contracts/meta.schema.json"]
consumes = []

[evals]
path = "system/evals/ingest/"
command = "just eval ingest"

[budget]
# Raised 8000 -> 10000 and 7000 -> 8000 for the staging round: SPEC-ingest-003 and the
# library-layout staging section land the assembly at ~6767 of 8000 and the module at
# ~5908 of 7000. Both fit, neither comfortably, and a generator squeezing under a tight
# cap wastes an attempt.
# Raised 10000 -> 13000 for the cockpit round: SPEC-ingest-004, the
# SPEC-ingest-001 default amendment, LESSON-0006 and test_fetcher_output.py.
# Raised 13000 -> 14500: the percentage amendment and its two evals.
context_tokens = 14500
# Raised 8000 -> 9500: capture-and-replay around the fetcher subprocess, the
# staging-bytes heartbeat thread, and the --verbose flag on add's parser.
# Raised 9500 -> 10500: the denominator read from staged metadata, the 99 cap,
# and the monotonic display.
src_tokens = 10500
