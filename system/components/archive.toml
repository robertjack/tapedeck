[component]
name = "archive"
purpose = "Pure deterministic render: meta.json + transcript.json -> archive/<id>.md with frontmatter and chaptered, timestamp-linked transcript sections. Identical inputs give byte-identical output (SPEC-archive-001)."
pace = "fast"
language = "python"

[owns]
paths = ["src/archive/"]
data = ["archive/*.md"]

[boundary]
contracts = ["system/contracts/library-layout.md", "system/contracts/meta.schema.json", "system/contracts/transcript.schema.json"]
consumes = []

[evals]
path = "system/evals/archive/"
command = "just eval archive"

[budget]
# Raised 8000 -> 11000 for the anchor round: SPEC-archive-002 and
# test_paragraph_anchors.py join an assembly that was already carrying two
# schema contracts near the old cap.
# Raised for the local-files round: the SPEC-archive-001 amendment, the
# library-layout deep-link rule and test_local_addresses.py.
context_tokens = 13000
# Raised 6000 -> 7000: paragraphs carry their first segment's start, so
# _paragraphs must keep starts alongside prose.
src_tokens = 7500
