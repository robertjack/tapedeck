# Packaging is durable-layer plumbing: it wires generated packages under src/
# into the project env. Components are added to `packages` as they are generated;
# the `tapedeck` console script appears with the cli component.

[project]
# Distribution name: PyPI's `tapedeck` is squatted by an unrelated project, so
# the package ships as `tapedeck-cli` while the executable stays `tapedeck`
# (SPEC-cli-006, amended for the distribution round).
name = "tapedeck-cli"
# the one place the version is written; `tapedeck --version` reads it back out of
# the installed distribution's metadata (SPEC-cli-006)
version = "0.3.0"
description = "Your local video brain: download YouTube videos, transcribe on-device, search every spoken moment, ask questions with verified timestamped citations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
keywords = ["youtube", "transcription", "search", "video", "knowledge-base", "whisper", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Repository = "https://github.com/robertjack/tapedeck"
Issues = "https://github.com/robertjack/tapedeck/issues"

[project.scripts]
tapedeck = "cli.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archive", "src/index", "src/ingest", "src/transcribe", "src/cli", "src/ask", "src/wiki"]

[tool.hatch.build.targets.wheel.force-include]
# the installed tool carries the manual (SPEC-cli-005); cli/teach.py looks here first
"MANUAL.md" = "cli/MANUAL.md"
